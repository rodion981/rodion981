<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Rodion TECH Smart Home Control Center</title>
  <desc id="desc">A dark technical control panel with connected nodes, a home icon and an energy waveform.</desc>
  <defs>
