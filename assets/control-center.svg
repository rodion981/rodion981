      <stop offset="1" stop-color="#092b3e"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop offset="0" stop-color="#64e7ff"/>
      <stop offset="1" stop-color="#36a9f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b4e9ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
